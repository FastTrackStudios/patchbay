[package]
name = "patchbay-web"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "patchbay-web"
path = "src/main.rs"

[dependencies]
patchbay-proto.workspace = true
patchbay-ui.workspace = true
dioxus = { workspace = true, default-features = true, features = ["web", "launch"] }
vox.workspace = true
vox-core.workspace = true
vox-websocket.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[lints]
workspace = true
