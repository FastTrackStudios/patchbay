# Checks — every PR into main (or a release/v* hotfix line) and every push
# to them. One job on a hosted runner, in the nix dev shell (the same
# toolchain, PipeWire and cargo-rail as `nix develop`), each step guarded
# with `!cancelled()` so one run reports everything:
#
#   fmt --check, `cargo rail change check` (PRs: every changed crate has a
#   change file), cargo check (all targets), the browser remote's wasm
#   check, cargo test; then the PipeWire sandbox integration test, ADVISORY
#   for now (see its step).
#
# A release PR (head `release/pending`) is only a version + changelog
# commit: the release guard (run from the BASE commit's script) decides
# it, and the heavy steps skip. `Build + test` is the REQUIRED check (the
# aggregator): it never skips, and fails unless the checks job succeeded.
# `just release-tag` and the tag guard require it green on a release.
# `just ci` runs the same steps locally.

name: checks

on:
  pull_request:
    branches: [main, "release/**"]
  # Hotfix lines only: `release/pending` is a PR head, decided by its PR's
  # run (the release guard), not a full push build of its own.
  push:
    branches: [main, "release/v*"]
  workflow_dispatch:

# A PR's newer push supersedes its older run. Pushes to main / release/v*
# are never cancelled: `just release-tag` needs the release merge commit's
# own `Build + test` green, and a cancelled run reads as not green.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIX_DEV: nix develop --accept-flake-config -c

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the change check and the release guard need the
          # PR's base and head.
          fetch-depth: 0

      - name: Release PR? (the base commit's release guard)
        id: release
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -u
          # 0 = a sound release PR (skip the rest), 1 = not a release PR,
          # anything else = a release PR the guard refuses (fail).
          rc=1
          if git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh" 2>/dev/null; then
            bash "${RUNNER_TEMP}/release-base.sh" release-only || rc=$?
          fi
          case "$rc" in
            0) echo "skip=true" >> "$GITHUB_OUTPUT"
               echo "release commit only (${HEAD_REF} -> ${BASE_REF}): version + changelog, nothing to build" ;;
            1) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::${HEAD_REF} -> ${BASE_REF} is a release PR the release guard refuses (see above)"
               exit 1 ;;
          esac

      - uses: ./.github/actions/hosted-nix
        if: ${{ steps.release.outputs.skip != 'true' }}

      - name: Rust cache (main saves)
        if: ${{ steps.release.outputs.skip != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.release.outputs.skip != 'true' }}
        run: ${NIX_DEV} cargo fmt --all -- --check

      - name: cargo rail change check
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.release.outputs.skip != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # --since the PR's base commit: --merge-base cannot find the
        # default branch in a CI checkout.
        run: ${NIX_DEV} cargo rail change check --since "${BASE_SHA}"

      - name: cargo check --workspace
        if: ${{ !cancelled() && steps.release.outputs.skip != 'true' }}
        run: ${NIX_DEV} cargo check --workspace --all-targets --locked

      - name: wasm check (browser remote)
        if: ${{ !cancelled() && steps.release.outputs.skip != 'true' }}
        run: ${NIX_DEV} cargo check -p fts-patchbay --target wasm32-unknown-unknown --no-default-features --features web --locked

      - name: cargo test --workspace
        if: ${{ !cancelled() && steps.release.outputs.skip != 'true' }}
        # The PipeWire sandbox test runs in its own step below.
        run: ${NIX_DEV} cargo test --workspace --locked -- --skip engine_drives_a_real_graph

      # ADVISORY: on hosted runners the sandbox's buses never get their
      # ports (the session manager does not configure them), so this has
      # failed since the nix shell landed (old main, 2026-09-09). It runs
      # and prints the daemons' logs, but does not fail the check until it
      # is fixed.
      - name: PipeWire sandbox test (advisory)
        if: ${{ !cancelled() && steps.release.outputs.skip != 'true' }}
        continue-on-error: true
        run: ${NIX_DEV} cargo test -p patchbay --features server --test engine_sandbox --locked

  # The REQUIRED check. A required check that is skipped counts as passing,
  # so this never skips: it fails unless the checks job succeeded.
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks]
    if: ${{ always() }}
    steps:
      - name: The checks job succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "checks: ${CHECKS}"
          [ "${CHECKS}" = success ] || { echo "::error::checks: ${CHECKS}"; exit 1; }
