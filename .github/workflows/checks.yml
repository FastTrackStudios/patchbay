name: checks

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dev shell owns the toolchain (pinned by rust-toolchain.toml)
      # AND the system libraries AND the tools the code shells out to —
      # pipewire, wireplumber, pactl/parec. That last group is why this
      # replaced the apt list: they aren't link-time deps, so a missing
      # one didn't fail the build, it just made features silently no-op.
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: nix develop --command cargo fmt --all -- --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets

      # Includes the sandboxed integration tests, which spawn a private
      # PipeWire daemon. PATCHBAY_REQUIRE_SANDBOX (set by the dev shell)
      # makes a missing daemon a failure rather than a silent skip.
      - name: cargo test
        run: nix develop --command cargo test --workspace
