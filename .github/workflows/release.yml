# Release — the guard on every release PR into main or a release/v*
# hotfix line, and the GitHub Release once a release tag is pushed. The
# fleet flow (v4) is the `release-workflow` skill; patchbay's specifics are
# in AGENTS.md; the logic is scripts/release.sh, so a human can run every
# step of it by hand (`just release-*`).
#
#   PR into main or release/**   "Release guard": cheap, on a hosted
#                          runner. Only a release PR (head `release/pending`
#                          in this repo) is checked; any other PR skips. A
#                          release PR must be ONE commit
#                          `chore(release): vYY.M.MICRO` directly on the
#                          CURRENT head of its base (fetched now, not the
#                          event's base.sha), at the computed next CalVer
#                          version, touching only the version line(s), the
#                          new CHANGELOG.md section and the change files it
#                          consumed. checks.yml runs the same guard, so a
#                          refused release PR also fails `Build + test`.
#   push tag v*            "GitHub Release": the tag guard (the tag is a
#                          release commit on main or release/v*, with
#                          `Build + test` green), then the GitHub Release.
#                          A tag is pushed by `just release-tag` as the
#                          fts-forge App or a person: a tag pushed with
#                          GITHUB_TOKEN starts no workflow.
#   workflow_dispatch      the same, by hand, with the tag as the ref.
#
# SECURITY: the guard runs the BASE commit's copy of scripts/release.sh,
# never the PR's: a release PR that edits the script must not judge itself.

name: release

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    # Only release PRs (head `release/*`, e.g. `release/pending`) and PRs into
    # a `release/**` hotfix line. Every other PR skips it at once (no runner;
    # a skipped required check counts as passed).
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Is this release PR sound? (the base commit's script)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if ! git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh"; then
            echo "::notice::the base has no scripts/release.sh: nothing to guard"
            exit 0
          fi
          bash "${RUNNER_TEMP}/release-base.sh" guard

  publish:
    name: GitHub Release
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      checks: read
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: The tag is a green release commit on main or release/v*
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh tag-guard
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh publish
