[package]
name = "patchbay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Studio routing: the patchbay server (host audio graph, Core Audio, Dante, Yamaha and Antelope adapters), its wire types, and its UI"

[lints]
workspace = true

[features]
default = ["vox"]
server = ["dep:architect-telemetry", "dep:dirs", "dep:eyre", "dep:facet-styx", "dep:futures-util", "dep:if-addrs", "dep:inferno-net", "dep:mdns-sd", "dep:parking_lot", "dep:serde_json", "dep:socket2", "dep:tokio", "dep:tracing"]
tcc-spi = []
ui = ["dep:dioxus", "dep:futures-util", "dep:music-catalog", "dep:tracing"]
vox = []

[dependencies]
architect = { workspace = true, features = ["vox"] }
architect-telemetry = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
dirs = { version = "6", optional = true }
eyre = { workspace = true, optional = true }
facet = { workspace = true }
facet-styx = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
if-addrs = { version = "0.13", optional = true }
inferno-net = { workspace = true, optional = true }
mdns-sd = { version = "0.13", optional = true }
music-catalog = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
tracing = { workspace = true, optional = true }
vox = { workspace = true }
vox-types = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
vox-core = { workspace = true }
vox-websocket = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6" }
dispatch2 = { version = "0.3" }
libc = { version = "0.2" }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSRunningApplication", "NSView", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFNumber", "CFArray", "CFDictionary", "CFData"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID", "NSValue", "NSURL"] }

